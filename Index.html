  --tw-ring-shadow: var(--tw-ring-inset) 0 0 0 calc(3px + var(--tw-ring-offset-width)) var(--tw-ring-color);
  box-shadow: var(--tw-ring-offset-shadow), var(--tw-ring-shadow), var(--tw-shadow, 0 0 #0000);
}
.filter{
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}
:root{
  --surface:#f3f6fb;
  --surface-2:#ffffff;
  --surface-3:#e8effa;
  --ink:#0f2040;
  --muted:#66788f;
  --line:#d9e2ef;
  --primary:#163a78;
  --primary-2:#2563eb;
  --primary-soft:#e7effc;
  --accent:#ffb020;
  --good:#15803d;
  --good-soft:#e5f6ea;
  --warn:#b45309;
  --warn-soft:#fff4d6;
  --bad:#be123c;
  --bad-soft:#fee8ec;
}
@media (prefers-color-scheme: dark){
  :root{
    --surface:#0b1528;
    --surface-2:#13233f;
    --surface-3:#1b3052;
    --ink:#edf2fa;
    --muted:#a7b6cc;
    --line:#29406a;
    --primary:#7fb0ff;
    --primary-2:#5d9bff;
    --primary-soft:#1b3052;
    --accent:#ffca55;
    --good:#6ee7a3;
    --good-soft:#173d2b;
    --warn:#ffcf7a;
    --warn-soft:#463517;
    --bad:#ff8ca0;
    --bad-soft:#4a1c2b;
  }
}
*{
  box-sizing:border-box
}
html,body{
  margin:0;
  padding:0;
  background:var(--surface);
  color:var(--ink);
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif
}
button,input,select,textarea{
  font:inherit
}
button{
  cursor:pointer
}
input,select,textarea{
  color:var(--ink);
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px 13px;
  outline:none;
  width:100%;
  font-size:16px
}
@keyframes pwaPulse{
  0%,100%{
    transform:scale(1)
  }
  50%{
    transform:scale(1.04)
  }
}
.pwa-splash-logo{
  animation:pwaPulse 1.1s ease-in-out infinite
}
input:focus,select:focus,textarea:focus{
  border-color:var(--primary-2);
  box-shadow:0 0 0 3px rgba(37,99,235,.14)
}
.field-label{
  display:block;
  font-size:12px;
  font-weight:800;
  letter-spacing:.04em;
  text-transform:uppercase;
  color:var(--muted);
  margin:0 0 7px
}
.chip{
  border:1px solid var(--line);
  background:var(--surface-2);
  border-radius:999px;
  padding:8px 11px;
  font-size:13px;
  font-weight:700;
  color:var(--ink)
}
.chip.active{
  background:var(--primary);
  color:#fff;
  border-color:var(--primary)
}
.card{
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:20px;
  box-shadow:0 6px 22px rgba(15,32,64,.05)
}
.no-scrollbar::-webkit-scrollbar{
  display:none
}
.no-scrollbar{
  scrollbar-width:none
}
/* Fallback fullscreen: dipakai saat browser / iframe memblokir fullscreen asli. */
body.app-fullscreen{
  overflow:hidden;
  background:#ffffff
}
body.app-fullscreen [data-safe-area-inset-root]{
  position:fixed !important;
  top:0 !important;
  left:0 !important;
  width:100vw !important;
  height:100vh !important;
  max-height:100vh;
  z-index:9999;
  overflow:auto;
  background:#ffffff
}
body.app-fullscreen .fullscreen-exit-btn{
  position:fixed;
  top:calc(var(--safe-area-inset-top, 0px) + 10px);
  right:12px;
  z-index:10000
}
.hover\:bg-\[var\(--primary-soft\)\]:hover{
  background-color: var(--primary-soft);
}
.hover\:bg-white\/10:hover{
  background-color: rgb(255 255 255 / 0.1);
}
.hover\:text-\[var\(--primary\)\]:hover{
  color: var(--primary);
}
.hover\:text-white:hover{
  --tw-text-opacity: 1;
  color: rgb(255 255 255 / var(--tw-text-opacity, 1));
}
.disabled\:opacity-60:disabled{
  opacity: 0.6;
}
@media (min-width: 640px){
  .sm\:inline{
    display: inline;
  }
  .sm\:flex{
    display: flex;
  }
  .sm\:hidden{
    display: none;
  }
  .sm\:w-auto{
    width: auto;
  }
  .sm\:flex-none{
    flex: none;
  }
  .sm\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .sm\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .sm\:grid-cols-4{
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
  .sm\:grid-cols-6{
    grid-template-columns: repeat(6, minmax(0, 1fr));
  }
  .sm\:grid-cols-\[150px_1fr_auto\]{
    grid-template-columns: 150px 1fr auto;
  }
  .sm\:grid-cols-\[160px_140px_1fr_auto\]{
    grid-template-columns: 160px 140px 1fr auto;
  }
  .sm\:grid-cols-\[180px_140px_1fr_auto\]{
    grid-template-columns: 180px 140px 1fr auto;
  }
  .sm\:grid-cols-\[1fr_auto\]{
    grid-template-columns: 1fr auto;
  }
  .sm\:flex-nowrap{
    flex-wrap: nowrap;
  }
  .sm\:items-center{
    align-items: center;
  }
  .sm\:p-4{
    padding: 1rem;
  }
  .sm\:p-5{
    padding: 1.25rem;
  }
  .sm\:p-6{
    padding: 1.5rem;
  }
  .sm\:p-7{
    padding: 1.75rem;
  }
  .sm\:px-4{
    padding-left: 1rem;
    padding-right: 1rem;
  }
  .sm\:px-6{
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }
  .sm\:pb-\[104px\]{
    padding-bottom: 104px;
  }
  .sm\:text-2xl{
    font-size: 1.5rem;
    line-height: 2rem;
  }
  .sm\:text-\[11px\]{
    font-size: 11px;
  }
  .sm\:text-base{
    font-size: 1rem;
    line-height: 1.5rem;
  }
  .sm\:text-lg{
    font-size: 1.125rem;
    line-height: 1.75rem;
  }
  .sm\:text-sm{
    font-size: 0.875rem;
    line-height: 1.25rem;
  }
}
@media (min-width: 768px){
  .md\:block{
    display: block;
  }
  .md\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
@media (min-width: 1024px){
  .lg\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .lg\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .lg\:grid-cols-6{
    grid-template-columns: repeat(6, minmax(0, 1fr));
  }
  .lg\:grid-cols-7{
    grid-template-columns: repeat(7, minmax(0, 1fr));
  }
  .lg\:grid-cols-\[\.8fr_1\.2fr\]{
    grid-template-columns: .8fr 1.2fr;
  }
  .lg\:grid-cols-\[1\.25fr_\.75fr\]{
    grid-template-columns: 1.25fr .75fr;
  }
}
@media (min-width: 1280px){
  .xl\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .xl\:grid-cols-6{
    grid-template-columns: repeat(6, minmax(0, 1fr));
  }
}
